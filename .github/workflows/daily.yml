name: Update Taiwan stock daily candles
on:
  workflow_dispatch:
  schedule:
    # 18:30 Taiwan time Mon-Fri = 10:30 UTC
    - cron: '30 10 * * 1-5'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh market data
        run: python scripts/update.py
      - name: Commit new data (if any)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/market.json
          git diff --staged --quiet || (git commit -m 'chore: daily Taiwan market snapshot' && git push)
